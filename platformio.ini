; PlatformIO project — PC Monitor (2004 LCD firmware)
;
; Default target is the Arduino Nano w/ ATmega168P (16 KB flash, 1 KB SRAM).
; A 328P environment is provided for later (32 KB flash, 2 KB SRAM).
;
;   Build/upload 168P (default): pio run -e nanoatmega168 -t upload
;   Build/upload 328P:           pio run -e nanoatmega328 -t upload
;   Serial monitor:              pio device monitor

[platformio]
default_envs = nanoatmega168

[common]
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; ── Arduino Nano, ATmega168P (1 KB SRAM — tight!) ──────────────────────────────
[env:nanoatmega168]
platform = atmelavr
board = nanoatmega168
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

; ── Arduino Nano, ATmega328P (old bootloader) ──────────────────────────────────
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

; ── Arduino Nano, ATmega328P (new/optiboot bootloader) ─────────────────────────
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
